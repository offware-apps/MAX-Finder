name: PR screenshots

on:
  push:
    branches: [pr-83-screenshots]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/shot-pr.mjs docs/pr-83
      - name: Commit the screenshots
        run: |
          git config user.name "David"
          git config user.email "60177543+davd-gzl@users.noreply.github.com"
          git add docs/pr-83
          git commit -q -m "Add the PR screenshots"
          git push origin HEAD:pr-83-screenshots
